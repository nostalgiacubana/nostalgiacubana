<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nostalgia Cubana - Menú</title>
    <style>
        :root {
            --rojo: #C7362F;
            --verde: #25D366;
            --crema: #FDF8F0;
            --oscuro: #3E2A1F;
            --azul: #1E3A5F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--crema);
            color: var(--oscuro);
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            padding: 15px;
        }

        .menu-col { flex: 2; min-width: 320px; }

        .hero {
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #f0e1d4;
        }

        .hero h1 { color: var(--rojo); font-size: 1.8rem; margin-bottom: 5px; }
        .hero p { font-size: 0.9rem; color: #666; font-weight: 500; }
        
        .status-badge { 
            display: inline-block; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            margin-top: 10px; 
            font-weight: bold; 
        }
        .open { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .closed { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        .menu-section {
            background: white;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 20px;
            border-left: 6px solid var(--rojo);
        }

        .menu-section h2 { font-size: 1.1rem; color: var(--rojo); margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px;}

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

        .menu-item {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0e1d4;
        }

        .item-name { font-weight: 600; font-size: 0.9rem; }
        .item-price { color: var(--azul); font-weight: 800; font-size: 0.85rem; }

        .btn-agregar {
            background-color: var(--rojo);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .cart-col {
            flex: 1;
            min-width: 320px;
            position: sticky;
            top: 15px;
            align-self: flex-start;
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f9f9f9;
            gap: 8px;
        }

        .cart-item-name { flex: 1; font-size: 0.85rem; font-weight: 600; }

        .qty-controls {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border-radius: 20px;
            padding: 2px;
        }

        .btn-qty {
            background: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-value { margin: 0 8px; font-weight: bold; font-size: 0.85rem; min-width: 15px; text-align: center; }
        .subtotal-text { font-weight: 700; color: var(--azul); font-size: 0.85rem; min-width: 60px; text-align: right; }

        .total-box { margin-top: 15px; padding-top: 10px; border-top: 2px solid var(--oscuro); text-align: right; }
        .total-box h3 { font-size: 1.4rem; color: var(--rojo); }

        .btn-whatsapp {
            background-color: var(--verde);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1rem;
            margin-top: 15px;
            cursor: pointer;
        }

        .btn-whatsapp:disabled { background-color: #bbb; cursor: not-allowed; }

        .delivery-info { font-size: 0.7rem; text-align: center; margin-top: 10px; color: #666; }

        @media (max-width: 800px) {
            .app-container { flex-direction: column; }
            .cart-col { position: static; order: -1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="menu-col">
        <div class="hero">
            <h1>🇨🇺 Nostalgia Cubana</h1>
            <p>Martes a Domingos: 9:00 AM - 9:00 PM</p>
            <div id="status-badge"></div>
        </div>

        <div class="menu-section">
            <h2>🍟 Entrantes</h2>
            <div class="menu-grid" id="grid-entrantes"></div>
        </div>

        <div class="menu-section">
            <h2>🍤 Tostones Rellenos</h2>
            <div class="menu-grid" id="grid-tostones"></div>
        </div>

        <div class="menu-section">
            <h2>🍛 Platos Principales</h2>
            <div class="menu-grid" id="grid-principales"></div>
        </div>

        <div class="menu-section">
            <h2>🍚 Guarniciones</h2>
            <div class="menu-grid" id="grid-guarniciones"></div>
        </div>
    </div>

    <div class="cart-col">
        <div class="cart-title" style="text-align:center; font-weight:800; margin-bottom:10px;">🧾 MI PEDIDO</div>
        <div id="cart-list">
            <p style="text-align:center; color:#999; padding:10px;">Carrito vacío</p>
        </div>
        <div class="total-box">
            <p style="font-size:0.7rem; color:#666;">Total a pagar:</p>
            <h3 id="total-price">$0</h3>
        </div>
        <button id="btn-pedir" onclick="enviarWhatsApp()" class="btn-whatsapp">📲 PEDIR POR WHATSAPP</button>
        <div class="delivery-info">WhatsApp: +53 63220737</div>
    </div>
</div>

<script>
    const menuData = {
        entrantes: [
            { n: "Puré de malanga", p: 500 }, { n: "Tostones chatinos", p: 350 }, { n: "Chicharritas", p: 300 }, { n: "Plátano frito", p: 500 }, { n: "Garbanzo frito", p: 1000 }, { n: "Pollo chillado", p: 1200 }, { n: "Tamal en hoja", p: 300 }, { n: "Tamal con chicharrones (2)", p: 1500 }, { n: "Tamal con Masa frita y ensalada", p: 2500 }, { n: "Tamal en casuela", p: 1000 }, { n: "Picadera nostalgia cubana", p: 3000 }
        ],
        tostones: [
            { n: "Tostón relleno de jamón", p: 600 }, { n: "Tostón relleno de atún", p: 850 }, { n: "Tostón relleno de jamón y queso", p: 850 }
        ],
        principales: [
            { n: "Arroz frito", p: 1300 }, { n: "Bistec encobillado", p: 1500 }, { n: "Bistec Uruguayo", p: 2500 }, { n: "Fricase de pollo", p: 1800 }, { n: "Fricase de cerdo", p: 2000 }, { n: "Pollo asado", p: 1500 }, { n: "Pollo frito", p: 1600 }, { n: "Fajitas de pollo", p: 1800 }, { n: "Fajitas de cerdo", p: 2200 }, { n: "Picadillo de la abuela", p: 1500 }, { n: "Picadillo a la italiana", p: 1300 }, { n: "Mas de cerdo", p: 2200 }, { n: "Higado a la italiana", p: 1300 }
        ],
        guarniciones: [
            { n: "Arroz moro (adicional)", p: 250 }, { n: "Arroz blanco (adicional)", p: 250 }, { n: "Termo pack (envase)", p: 100 }
        ]
    };

    let cart = [];

    // VALIDACIÓN DE HORARIO Y DÍA
    function checkStatus() {
        const now = new Date();
        const day = now.getDay(); // 0: Dom, 1: Lun, 2: Mar...
        const hour = now.getHours();
        const btn = document.getElementById('btn-pedir');
        const badge = document.getElementById('status-badge');

        let isOpen = false;
        let message = "";

        if (day === 1) { // Lunes Cerrado
            message = "Cerrado hoy (Lunes)";
            isOpen = false;
        } else if (hour >= 9 && hour < 21) { // 9 AM a 9 PM
            message = "Abierto ahora";
            isOpen = true;
        } else {
            message = "Cerrado ahora (Horario 9am-9pm)";
            isOpen = false;
        }

        if (isOpen) {
            badge.innerHTML = `<span class="status-badge open">🟢 ${message}</span>`;
            btn.disabled = false;
            btn.innerHTML = "📲 PEDIR POR WHATSAPP";
        } else {
            badge.innerHTML = `<span class="status-badge closed">🔴 ${message}</span>`;
            btn.disabled = true;
            btn.innerHTML = "CERRADO (Vuelve pronto)";
        }
    }

    function renderMenu() {
        for (const cat in menuData) {
            const container = document.getElementById(`grid-${cat}`);
            if(container) {
                container.innerHTML = menuData[cat].map(item => `
                    <div class="menu-item">
                        <div class="item-info">
                            <span class="item-name">${item.n}</span><br>
                            <span class="item-price">$${item.p}</span>
                        </div>
                        <button class="btn-agregar" onclick="addToCart('${item.n}', ${item.p})">Añadir</button>
                    </div>
                `).join('');
            }
        }
    }

    function addToCart(name, price) {
        const index = cart.findIndex(i => i.name === name);
        if (index > -1) {
            cart[index].qty++;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCart();
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById("cart-list");
        const totalEl = document.getElementById("total-price");
        if (cart.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#999; padding:10px;">Carrito vacío</p>`;
            totalEl.innerText = "$0";
            return;
        }
        let total = 0;
        list.innerHTML = cart.map((item, i) => {
            const sub = item.price * item.qty;
            total += sub;
            return `
                <div class="cart-item">
                    <span class="cart-item-name">${item.name}</span>
                    <div class="qty-controls">
                        <button class="btn-qty" onclick="changeQty(${i}, -1)">-</button>
                        <span class="qty-value">${item.qty}</span>
                        <button class="btn-qty" onclick="changeQty(${i}, 1)">+</button>
                    </div>
                    <span class="subtotal-text">$${sub}</span>
                </div>
            `;
        }).join('');
        totalEl.innerText = `$${total}`;
    }

    function enviarWhatsApp() {
        if (cart.length === 0) return;
        let total = 0;
        let msg = "🍽️ *PEDIDO NOSTALGIA CUBANA*%0A";
        cart.forEach(item => {
            const sub = item.price * item.qty;
            total += sub;
            msg += `• ${item.qty}x ${item.name} ($${sub})%0A`;
        });
        msg += `%0A💰 *TOTAL: $${total} CUP*%0A%0A📍 *Dirección:*`;
        window.open(`https://wa.me/5363220737?text=${msg}`, "_blank");
    }

    renderMenu();
    checkStatus();
    // Revisar el horario cada minuto por si cambia mientras el cliente mira el menú
    setInterval(checkStatus, 60000);
</script>
</body>
</html>
